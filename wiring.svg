<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">XIAO ESP32-S3 SCD41 OLED wiring diagram</title>
  <desc id="desc">A XIAO ESP32-S3 connects to a 128 by 64 I2C OLED on GPIO 1 and 2 and an SCD41 breakout on GPIO 3 and 4. Both modules share 3.3 volt power and ground.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #163047; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52677a; }
      .device { fill: #ffffff; stroke: #a9bac9; stroke-width: 2; }
      .board { fill: #d9f3ec; stroke: #16866e; stroke-width: 3; }
      .module { fill: #f8fbff; stroke: #8098ac; stroke-width: 2; }
      .device-title { font-size: 19px; font-weight: 700; }
      .device-sub { font-size: 13px; fill: #52677a; }
      .pin { font-size: 14px; font-weight: 650; }
      .small { font-size: 12px; fill: #52677a; }
      .wire { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .power { stroke: #df5b47; }
      .ground { stroke: #435466; }
      .sda { stroke: #3178c6; }
      .scl { stroke: #d99a21; }
      .terminal { stroke: #ffffff; stroke-width: 2; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#df5b47"/></marker>
  </defs>

  <rect width="1200" height="760" fill="#f3f7fa"/>
  <text x="52" y="56" class="title">XIAO ESP32-S3 · SCD41 · OLED</text>
  <text x="52" y="84" class="subtitle">Two separate I²C buses · all grounds connected · use 3.3 V-compatible breakout modules</text>

  <!-- Wires are behind the component cards. -->
  <!-- Shared 3V3 branches -->
  <path class="wire power" d="M 400 252 H 520 V 176 H 854"/>
  <path class="wire power" d="M 520 252 V 480 H 854"/>
  <!-- Shared ground branches -->
  <path class="wire ground" d="M 400 294 H 560 V 218 H 854"/>
  <path class="wire ground" d="M 560 294 V 522 H 854"/>
  <!-- OLED I2C -->
  <path class="wire sda" d="M 400 366 H 690 V 278 H 854"/>
  <path class="wire scl" d="M 400 410 H 730 V 320 H 854"/>
  <!-- Sensor I2C -->
  <path class="wire sda" d="M 400 470 H 770 V 566 H 854"/>
  <path class="wire scl" d="M 400 514 H 810 V 608 H 854"/>

  <!-- XIAO board -->
  <rect x="70" y="174" width="330" height="414" rx="22" class="board"/>
  <rect x="180" y="192" width="110" height="26" rx="8" fill="#b8d8d0" stroke="#16866e" stroke-width="1.5"/>
  <text x="235" y="210" text-anchor="middle" class="small">USB-C</text>
  <text x="235" y="248" text-anchor="middle" class="device-title">XIAO ESP32-S3</text>
  <text x="235" y="271" text-anchor="middle" class="device-sub">Use the labeled header pins</text>
  <rect x="88" y="227" width="22" height="326" rx="9" fill="#b4c9c2"/>
  <circle cx="400" cy="252" r="7" fill="#df5b47" class="terminal"/>
  <circle cx="400" cy="294" r="7" fill="#435466" class="terminal"/>
  <circle cx="400" cy="366" r="7" fill="#3178c6" class="terminal"/>
  <circle cx="400" cy="410" r="7" fill="#d99a21" class="terminal"/>
  <circle cx="400" cy="470" r="7" fill="#3178c6" class="terminal"/>
  <circle cx="400" cy="514" r="7" fill="#d99a21" class="terminal"/>
  <text x="126" y="257" class="pin">3V3</text>
  <text x="126" y="299" class="pin">GND</text>
  <text x="126" y="371" class="pin">D0 · GPIO 1</text>
  <text x="126" y="415" class="pin">D1 · GPIO 2</text>
  <text x="126" y="475" class="pin">D2 · GPIO 3</text>
  <text x="126" y="519" class="pin">D3 · GPIO 4</text>
  <text x="235" y="560" text-anchor="middle" class="small">Sketch-assigned GPIOs (not default SDA/SCL)</text>

  <!-- OLED -->
  <rect x="854" y="126" width="292" height="236" rx="18" class="module"/>
  <rect x="950" y="148" width="176" height="78" rx="8" fill="#172735" stroke="#5f7384" stroke-width="2"/>
  <rect x="963" y="164" width="150" height="44" rx="2" fill="#c6f2b5" opacity=".92"/>
  <text x="1038" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#20392a">CO₂ 812 PPM</text>
  <text x="1038" y="200" text-anchor="middle" font-size="10" fill="#20392a">T 22.4 C  RH 45%</text>
  <text x="1038" y="249" text-anchor="middle" class="device-title">128×64 I²C OLED</text>
  <text x="1038" y="269" text-anchor="middle" class="device-sub">SH1106-style · address 0x3C</text>
  <circle cx="854" cy="176" r="7" fill="#df5b47" class="terminal"/>
  <circle cx="854" cy="218" r="7" fill="#435466" class="terminal"/>
  <circle cx="854" cy="278" r="7" fill="#3178c6" class="terminal"/>
  <circle cx="854" cy="320" r="7" fill="#d99a21" class="terminal"/>
  <text x="875" y="181" class="pin">VCC</text>
  <text x="875" y="223" class="pin">GND</text>
  <text x="875" y="283" class="pin">SDA</text>
  <text x="875" y="325" class="pin">SCL</text>

  <!-- SCD41 breakout -->
  <rect x="854" y="430" width="292" height="236" rx="18" class="module"/>
  <rect x="970" y="453" width="136" height="75" rx="10" fill="#e8eff4" stroke="#91a6b6" stroke-width="2"/>
  <rect x="1001" y="470" width="74" height="41" rx="8" fill="#d2dce3" stroke="#91a6b6" stroke-width="1.5"/>
  <text x="1038" y="495" text-anchor="middle" class="small" font-weight="700">SCD41</text>
  <text x="1038" y="550" text-anchor="middle" class="device-title">SCD41 breakout</text>
  <text x="1038" y="570" text-anchor="middle" class="device-sub">I²C address 0x62</text>
  <circle cx="854" cy="480" r="7" fill="#df5b47" class="terminal"/>
  <circle cx="854" cy="522" r="7" fill="#435466" class="terminal"/>
  <circle cx="854" cy="566" r="7" fill="#3178c6" class="terminal"/>
  <circle cx="854" cy="608" r="7" fill="#d99a21" class="terminal"/>
  <text x="875" y="485" class="pin">VDD/VCC</text>
  <text x="875" y="527" class="pin">GND</text>
  <text x="875" y="571" class="pin">SDA</text>
  <text x="875" y="613" class="pin">SCL</text>

  <!-- Wire color key -->
  <rect x="70" y="630" width="708" height="72" rx="14" fill="#ffffff" stroke="#d2dde5" stroke-width="1.5"/>
  <text x="94" y="660" class="small" font-weight="700">WIRE KEY</text>
  <line x1="184" y1="655" x2="225" y2="655" class="wire power"/><text x="236" y="660" class="small">3V3</text>
  <line x1="308" y1="655" x2="349" y2="655" class="wire ground"/><text x="360" y="660" class="small">GND</text>
  <line x1="440" y1="655" x2="481" y2="655" class="wire sda"/><text x="492" y="660" class="small">SDA</text>
  <line x1="568" y1="655" x2="609" y2="655" class="wire scl"/><text x="620" y="660" class="small">SCL</text>
  <text x="94" y="684" class="small">Both modules share the XIAO's 3V3 and GND connections.</text>
</svg>
