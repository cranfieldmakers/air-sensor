<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">XIAO ESP32-S3 SCD41 OLED wiring diagram</title>
  <desc id="desc">A component-side view of the XIAO ESP32-S3 with 14 edge pins: D0 through D6 on the left and 5V, GND, 3V3, D10 through D7 on the right. The OLED uses D0 and D1; the SCD41 uses D2 and D3. Both modules share 3.3 volt power and ground.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #163047; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52677a; }
      .device { fill: #ffffff; stroke: #a9bac9; stroke-width: 2; }
      .board { fill: #d9f3ec; stroke: #16866e; stroke-width: 3; }
      .module { fill: #f8fbff; stroke: #8098ac; stroke-width: 2; }
      .device-title { font-size: 19px; font-weight: 700; }
      .device-sub { font-size: 13px; fill: #52677a; }
      .pin { font-size: 14px; font-weight: 650; }
      .small { font-size: 12px; fill: #52677a; }
      .wire { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .power { stroke: #df5b47; }
      .ground { stroke: #435466; }
      .sda { stroke: #3178c6; }
      .scl { stroke: #d99a21; }
      .terminal { stroke: #ffffff; stroke-width: 2; }
      .unused-pad { fill: #c3a76a; stroke: #ffffff; stroke-width: 2; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#df5b47"/></marker>
  </defs>

  <rect width="1200" height="810" fill="#f3f7fa"/>
  <text x="52" y="56" class="title">XIAO ESP32-S3 · SCD41 · OLED</text>
  <text x="52" y="84" class="subtitle">Two separate I²C buses · all grounds connected · use 3.3 V-compatible breakout modules</text>

  <!-- Wires are behind the component cards. -->
  <!-- Power and ground leave the XIAO's right-side header and loop around the modules. -->
  <path class="wire power" d="M 890 330 H 1000 V 100 H 30"/>
  <path class="wire power" d="M 30 100 V 130 H 60"/>
  <path class="wire power" d="M 30 100 V 320 H 60"/>
  <path class="wire ground" d="M 890 290 H 1020 V 700 H 40 V 310"/>
  <path class="wire ground" d="M 40 310 V 560"/>
  <path class="wire ground" d="M 40 310 H 60"/>
  <path class="wire ground" d="M 40 560 H 60"/>
  <!-- The signal wires connect directly to the left-side D0-D3 pads. -->
  <path class="wire sda" d="M 560 250 H 390"/>
  <path class="wire scl" d="M 560 292 H 390"/>
  <path class="wire sda" d="M 560 330 H 390"/>
  <path class="wire scl" d="M 560 370 H 390"/>

  <!-- XIAO board -->
  <rect x="560" y="210" width="330" height="310" rx="22" class="board"/>
  <rect x="670" y="216" width="110" height="20" rx="8" fill="#b8d8d0" stroke="#16866e" stroke-width="1.5"/>
  <text x="725" y="231" text-anchor="middle" class="small">USB-C</text>
  <text x="725" y="160" text-anchor="middle" class="device-title">XIAO ESP32-S3</text>
  <!-- Seven physical pads per side. Left: D0-D6; right: 5V, GND, 3V3, D10-D7. -->
  <circle cx="560" cy="250" r="8" fill="#3178c6" class="terminal"/>
  <circle cx="560" cy="292" r="8" fill="#d99a21" class="terminal"/>
  <circle cx="560" cy="330" r="8" fill="#3178c6" class="terminal"/>
  <circle cx="560" cy="370" r="8" fill="#d99a21" class="terminal"/>
  <circle cx="560" cy="410" r="8" class="unused-pad"/>
  <circle cx="560" cy="450" r="8" class="unused-pad"/>
  <circle cx="560" cy="490" r="8" class="unused-pad"/>
  <circle cx="890" cy="250" r="8" class="unused-pad"/>
  <circle cx="890" cy="290" r="8" fill="#435466" class="terminal"/>
  <circle cx="890" cy="330" r="8" fill="#df5b47" class="terminal"/>
  <circle cx="890" cy="370" r="8" class="unused-pad"/>
  <circle cx="890" cy="410" r="8" class="unused-pad"/>
  <circle cx="890" cy="450" r="8" class="unused-pad"/>
  <circle cx="890" cy="490" r="8" class="unused-pad"/>
  <text x="615" y="255" class="pin">D0 · GPIO 1</text>
  <text x="615" y="297" class="pin">D1 · GPIO 2</text>
  <text x="615" y="335" class="pin">D2 · GPIO 3</text>
  <text x="615" y="375" class="pin">D3 · GPIO 4</text>
  <text x="615" y="415" class="pin">D4 · GPIO 5</text>
  <text x="615" y="455" class="pin">D5 · GPIO 6</text>
  <text x="615" y="495" class="pin">D6 · GPIO 43</text>
  <text x="855" y="255" text-anchor="end" class="pin">5V (VBUS)</text>
  <text x="855" y="297" text-anchor="end" class="pin">GND</text>
  <text x="855" y="335" text-anchor="end" class="pin">3V3</text>
  <text x="855" y="375" text-anchor="end" class="pin">D10 · GPIO 9</text>
  <text x="855" y="415" text-anchor="end" class="pin">D9 · GPIO 8</text>
  <text x="855" y="455" text-anchor="end" class="pin">D8 · GPIO 7</text>
  <text x="855" y="495" text-anchor="end" class="pin">D7 · GPIO 44</text>
  <text x="725" y="540" text-anchor="middle" class="small">14 pads · D0/D1 to OLED · D2/D3 to SCD41</text>

  <!-- OLED -->
  <rect x="60" y="130" width="330" height="180" rx="18" class="module"/>
  <rect x="137" y="148" width="176" height="78" rx="8" fill="#172735" stroke="#5f7384" stroke-width="2"/>
  <rect x="150" y="164" width="150" height="44" rx="2" fill="#c6f2b5" opacity=".92"/>
  <text x="225" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#20392a">CO₂ 812 PPM</text>
  <text x="225" y="200" text-anchor="middle" font-size="10" fill="#20392a">T 22.4 C  RH 45%</text>
  <text x="225" y="249" text-anchor="middle" class="device-title">128×64 I²C OLED</text>
  <text x="225" y="269" text-anchor="middle" class="device-sub">SH1106-style · address 0x3C</text>
  <circle cx="60" cy="130" r="7" fill="#df5b47" class="terminal"/>
  <circle cx="60" cy="310" r="7" fill="#435466" class="terminal"/>
  <circle cx="390" cy="250" r="7" fill="#3178c6" class="terminal"/>
  <circle cx="390" cy="292" r="7" fill="#d99a21" class="terminal"/>
  <text x="80" y="135" class="pin">VCC</text>
  <text x="80" y="306" class="pin">GND</text>
  <text x="370" y="255" text-anchor="end" class="pin">SDA</text>
  <text x="370" y="297" text-anchor="end" class="pin">SCL</text>

  <!-- SCD41 breakout -->
  <rect x="60" y="320" width="330" height="240" rx="18" class="module"/>
  <rect x="180" y="360" width="90" height="70" rx="10" fill="#e8eff4" stroke="#91a6b6" stroke-width="2"/>
  <rect x="196" y="375" width="58" height="40" rx="8" fill="#d2dce3" stroke="#91a6b6" stroke-width="1.5"/>
  <text x="225" y="400" text-anchor="middle" class="small" font-weight="700">SCD41</text>
  <text x="225" y="455" text-anchor="middle" class="device-title">SCD41 breakout</text>
  <text x="225" y="475" text-anchor="middle" class="device-sub">I²C address 0x62</text>
  <circle cx="60" cy="320" r="7" fill="#df5b47" class="terminal"/>
  <circle cx="60" cy="560" r="7" fill="#435466" class="terminal"/>
  <circle cx="390" cy="330" r="7" fill="#3178c6" class="terminal"/>
  <circle cx="390" cy="370" r="7" fill="#d99a21" class="terminal"/>
  <text x="80" y="325" class="pin">VDD/VCC</text>
  <text x="80" y="556" class="pin">GND</text>
  <text x="370" y="335" text-anchor="end" class="pin">SDA</text>
  <text x="370" y="375" text-anchor="end" class="pin">SCL</text>

  <!-- Wire color key -->
  <rect x="70" y="725" width="708" height="66" rx="14" fill="#ffffff" stroke="#d2dde5" stroke-width="1.5"/>
  <text x="94" y="751" class="small" font-weight="700">WIRE KEY</text>
  <line x1="184" y1="746" x2="225" y2="746" class="wire power"/><text x="236" y="751" class="small">3V3</text>
  <line x1="308" y1="746" x2="349" y2="746" class="wire ground"/><text x="360" y="751" class="small">GND</text>
  <line x1="440" y1="746" x2="481" y2="746" class="wire sda"/><text x="492" y="751" class="small">SDA</text>
  <line x1="568" y1="746" x2="609" y2="746" class="wire scl"/><text x="620" y="751" class="small">SCL</text>
  <text x="94" y="775" class="small">D0-D3 are on the left; 3V3 and GND are on the right header.</text>
</svg>
